[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "telelux"
description = "Generate and share self-contained HTML views of agent transcripts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kevin Scott" }]
keywords = ["agents", "transcripts", "viewer", "llm", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dynamic = ["version"]
dependencies = [
    "pytest>=9.1.1",
    "pytest-watcher>=0.6.3",
]

[project.urls]
Repository = "https://github.com/thekevinscott/telelux"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Tagless checkouts still resolve to a usable dev version.
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/telelux"]
# Unit tests are colocated with their source, so the build has to drop them.
exclude = ["*_test.py", "conftest.py"]

[tool.hatch.build.targets.sdist]
exclude = ["*_test.py", "conftest.py"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-watcher>=0.6.3",
    "pytest-describe>=3.2.0",
    "pytest-mock>=3.15.1",
]

[tool.ruff.lint]
# One public callable per file, named to match the file. For a class that
# means the module is PascalCase, which N999 reads as invalid.
ignore = ["N999"]

[tool.pytest.ini_options]
# Scoped to src/ only: integration and e2e are separate tiers, invoked with
# an explicit path (tests/integration, tests/e2e) that overrides testpaths.
# A bare `pytest` — the unit tier — must not also collect the other tiers.
testpaths = ["src"]
pythonpath = ["src"]
