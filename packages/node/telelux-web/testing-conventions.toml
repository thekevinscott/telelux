[typescript]
# npm runs `prepare`/`prepack` on `pack` but can't guess the build script's
# name, so the packaging gate needs it stated to get a dist/ to scan.
build_command = "pnpm build"

# Paths below are relative to the scan root, which the conventions workflow
# sets to packages/node/telelux-web/src — not to this file's directory.

[[typescript.exempt]]
path = "main.tsx"
rules = ["colocated-test", "co-change"]
reason = "composition root: mounts the app into #root and holds no logic; the browser actually doing it is asserted in tests/integration"

[[typescript.exempt]]
path = "Viewer.test.tsx"
rules = ["unmocked-collaborator"]
reason = "@testing-library/react is the renderer this test runs in, not a collaborator of the component; mocking it would leave nothing under test"

[[typescript.exempt]]
path = "vitest.config.ts"
rules = ["colocated-test", "co-change"]
reason = "vitest configuration, not shipped source; it has to live in src/ because the coverage and mutation gates run vitest from there"

[[typescript.exempt]]
path = "main.tsx"
lines = [12]
rules = ["mutation"]
reason = "defensive guard: viewer.html always ships #root, so the throw cannot run in the built file; the mount itself is asserted in tests/integration"

[[typescript.exempt]]
path = "App.test.tsx"
rules = ["unmocked-collaborator"]
reason = "@testing-library/react is the renderer this test runs in, not a collaborator of the component; mocking it would leave nothing under test"

[[typescript.exempt]]
path = "UrlEntry.test.tsx"
rules = ["unmocked-collaborator"]
reason = "@testing-library/react is the renderer this test runs in, not a collaborator of the component; mocking it would leave nothing under test"

[[typescript.exempt]]
path = "use-fragment-transcript.test.ts"
rules = ["unmocked-collaborator"]
reason = "@testing-library/react's renderHook is the React root this hook runs in, not a collaborator of the hook; mocking it would leave nothing under test"

[[typescript.exempt]]
path = "use-fragment-transcript.ts"
lines = [36]
rules = ["mutation"]
reason = "equivalent mutant: the effect's dependency array holds no values, and replacing it with a one-element array of a constant string also never changes between renders, so the effect still runs once per mount"

[[typescript.exempt]]
path = "use-fragment-transcript.ts"
lines = [37]
rules = ["mutation"]
reason = "equivalent mutants: the mount effect fills the controls ref before the first render can hand cancel or retry to anything, so the optional chaining never meets null and dropping it changes nothing a user can reach"

[[typescript.exempt]]
path = "LocalFile.test.tsx"
rules = ["unmocked-collaborator"]
reason = "@testing-library/react is the renderer this test runs in, not a collaborator of the component; mocking it would leave nothing under test"

