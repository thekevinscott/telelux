[typescript]
# npm runs `prepare`/`prepack` on `pack` but can't guess the build script's
# name, so the packaging gate needs it stated to get a dist/ to scan.
build_command = "pnpm build"

# Paths below are relative to the scan root, which the conventions workflow
# sets to packages/node/telelux-web/src — not to this file's directory.

[[typescript.exempt]]
path = "main.tsx"
rules = ["colocated-test", "co-change"]
reason = "composition root: mounts the app into #root and holds no logic; the browser actually doing it is asserted in tests/integration"

[[typescript.exempt]]
path = "TranscriptBox.test.tsx"
rules = ["unmocked-collaborator"]
reason = "@testing-library/react is the renderer this test runs in, not a collaborator of the component; mocking it would leave nothing under test"

[[typescript.exempt]]
path = "vitest.config.ts"
rules = ["colocated-test", "co-change"]
reason = "vitest configuration, not shipped source; it has to live in src/ because the coverage and mutation gates run vitest from there"

[[typescript.exempt]]
path = "main.tsx"
lines = [6, 8, 9]
rules = ["mutation"]
reason = "composition root: the placeholder string, the #root id and its missing-element guard are only observable in a real browser, which tests/integration asserts via Playwright"

[[typescript.exempt]]
path = "TranscriptBox.tsx"
lines = [7]
rules = ["mutation"]
reason = "the empty-body mutant is a static mutant: the component binding is created at module load, before stryker's vitest runner activates per-test mutants, so it records no covering test. Applied by hand the same mutation fails all three tests in TranscriptBox.test.tsx — the suite does kill it, the runner just cannot attribute it"
