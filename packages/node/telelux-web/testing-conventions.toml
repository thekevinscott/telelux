path = "use-file-drop.test.ts"
rules = ["unmocked-collaborator"]
reason = "@testing-library/react's renderHook is the React root this hook runs in, not a collaborator of the hook; mocking it would leave nothing under test"

[[typescript.exempt]]
path = "main.tsx"
lines = [14]
rules = ["mutation"]
reason = "composition root: the captured page is what the standalone download is built from, and tests/integration asserts that download renders its transcript when opened from disk"

[[typescript.exempt]]
path = "LocalFile.tsx"
