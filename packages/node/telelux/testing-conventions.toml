[typescript]
# npm runs `prepare`/`prepack` on `pack` but can't guess the build script's
# name, so the packaging gate needs it stated to get a dist/ to scan.
build_command = "pnpm build"

# Paths below are relative to the scan root, which the conventions workflow
# sets to packages/node/telelux/src — not to this file's directory.

[[typescript.exempt]]
path = "index.ts"
rules = ["co-change"]
reason = "barrel: re-exports only; its test exists to load it for the coverage gate, not to track every re-export"

[[typescript.exempt]]
path = "vitest.config.ts"
rules = ["colocated-test", "co-change"]
reason = "vitest configuration, not shipped source; it has to live in src/ because the coverage and mutation gates run vitest from there"

[[typescript.exempt]]
path = "build-link.test.ts"
rules = ["unmocked-collaborator"]
reason = "The shared fixture and entropy source are test inputs; mocking them would remove the byte compatibility and link budget checks."

[[typescript.exempt]]
path = "encode-payload.test.ts"
rules = ["unmocked-collaborator"]
reason = "The shared fixture is the cross-language byte vector; mocking file access would replace the actual fixture."

[[typescript.exempt]]
path = "load-file.test.ts"
rules = ["unmocked-collaborator"]
reason = "Actual filesystem operations are the file reader contract, including the 50 MiB and UTF-8 checks."

[[typescript.exempt]]
path = "load-annotations.test.ts"
rules = ["unmocked-collaborator"]
reason = "Actual filesystem operations are the annotation loader contract, including JSON and UTF-8 errors."

[[typescript.exempt]]
path = "telelux.test.ts"
rules = ["unmocked-collaborator"]
reason = "Real files are needed to verify snapshot and exclusive-write behavior at the public API."

[[typescript.exempt]]
path = "build-link.ts"
rules = ["mutation"]
lines = [6]
reason = "Node treats an empty Buffer.byteLength encoding as UTF-8, so this string mutation preserves behavior."

[[typescript.exempt]]
path = "encode-payload.ts"
rules = ["mutation"]
lines = [4]
reason = "Node treats an empty Buffer.from encoding as UTF-8, so this string mutation preserves the payload bytes."

[[typescript.exempt]]
path = "telelux.ts"
rules = ["mutation"]
lines = [43]
reason = "Node treats an empty writeFileSync encoding as UTF-8, so this mutation preserves the output bytes."
