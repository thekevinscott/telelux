[typescript]
# npm runs `prepare`/`prepack` on `pack` but can't guess the build script's
# name, so the packaging gate needs it stated to get a dist/ to scan.
build_command = "pnpm build"

# Paths below are relative to the scan root, which the conventions workflow
# sets to packages/node/telelux-element/src — not to this file's directory.

[[typescript.exempt]]
path = "index.ts"
rules = ["colocated-test", "co-change"]
reason = "barrel: re-exports only, holds no logic of its own to test"

[[typescript.exempt]]
path = "vitest.config.ts"
rules = ["colocated-test", "co-change"]
reason = "vitest configuration, not shipped source; it has to live in src/ because the coverage and mutation gates run vitest from there"

[[typescript.exempt]]
path = "telelux-transcript.ts"
lines = [9, 10, 11, 12]
rules = ["mutation"]
reason = "static mutants: the reactive property table is read once when Lit registers the class at module load, before stryker's per-test instrumentation activates, so no test is recorded as covering it. Applied by hand, emptying the table fails every property-driven test in telelux-transcript.test.ts, and flipping attribute to true fails 'ignores a transcript attribute' — the suite kills them, the runner just cannot attribute it"

[[typescript.exempt]]
path = "transcript.ts"
lines = [3, 4, 7, 10, 11, 19, 24, 27, 28, 32, 33, 34, 35, 36, 37, 41, 45]
rules = ["mutation"]
reason = "static mutants: the zod schemas are built once at module load, before stryker's per-test instrumentation activates, so no test is recorded as covering them. Applied by hand (an empty role literal, an empty metadata union, an empty content-type enum), each fails the parseTranscript accept/reject cases in transcript.test.ts — the suite kills them, the runner just cannot attribute it. parseTranscript's own lines are not exempt"

[[typescript.exempt]]
path = "parse-json-object.ts"
lines = [7]
rules = ["mutation"]
reason = "equivalent mutant: emptying the catch arm makes the function fall out of the try and return undefined, which is what the arm returns. JSON.parse has no non-throwing form, so the arm cannot be written to differ"

[[typescript.exempt]]
path = "telelux-message.ts"
lines = [12, 15, 16, 17, 18, 19, 20, 23, 315]
rules = ["mutation"]
reason = "static mutants: the document icon, the reactive property table, the styles sheet, and the customElements.define call all run once at module load, before stryker's per-test instrumentation activates. Applied by hand, emptying the property table fails 're-renders when the message changes', flipping attribute to true fails 'ignores message and index attributes', flipping state to false or emptying a state entry fails 'ignores attributes named after its internal state', emptying the icon fails the metadata popover test, and emptying the tag name throws at import so the whole file fails; emptying the stylesheet is invisible to jsdom and fails the role-colour assertions in tests/integration/message-block.test.ts"

[[typescript.exempt]]
path = "telelux-transcript.ts"
lines = [15]
rules = ["mutation"]
reason = "static mutant: the styles sheet is read once when Lit registers the class at module load, before stryker's per-test instrumentation activates, and jsdom applies no layout to observe it. It only spaces the block list"

[[typescript.exempt]]
path = "telelux-metadata.ts"
lines = [9, 10, 13, 69]
rules = ["mutation"]
reason = "static mutants: the reactive property table, the styles sheet, and the customElements.define call run once at module load, before stryker's per-test instrumentation activates. Applied by hand, emptying the property table fails 're-renders when the metadata changes', flipping attribute to true fails 'ignores a metadata attribute', and emptying the tag name throws at import. The stylesheet is layout only"
