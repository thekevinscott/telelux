[typescript]
# npm runs `prepare`/`prepack` on `pack` but can't guess the build script's
# name, so the packaging gate needs it stated to get a dist/ to scan.
build_command = "pnpm build"

# Paths below are relative to the scan root, which the conventions workflow
# sets to packages/node/telelux-element/src — not to this file's directory.

[[typescript.exempt]]
path = "index.ts"
rules = ["colocated-test", "co-change"]
reason = "barrel: re-exports only, holds no logic of its own to test"

[[typescript.exempt]]
path = "vitest.config.ts"
rules = ["colocated-test", "co-change"]
reason = "vitest configuration, not shipped source; it has to live in src/ because the coverage and mutation gates run vitest from there"

[[typescript.exempt]]
path = "telelux-transcript.ts"
lines = [23, 24, 25, 26, 27, 28, 29, 30, 31]
rules = ["mutation"]
reason = "static mutants: the reactive property table is read once when Lit registers the class at module load, before stryker's per-test instrumentation activates, so no test is recorded as covering it. Applied by hand, emptying the table fails every property-driven test in telelux-transcript.test.ts, flipping attribute to true fails 'ignores a transcript attribute', emptying the theme entry or flipping reflect to false fails 'reflects the theme property to its attribute', and emptying the slotText, metadataOpen, copyStatus, or current entry, or flipping its state to false, fails 'ignores attributes named after its internal state'. Emptying the highlighted entry is equivalent: an attribute value is a string and never equals a numeric block index, so no block is highlighted either way"

[[typescript.exempt]]
path = "transcript.ts"
lines = [3, 4, 7, 10, 11, 19, 24, 27, 28, 32, 33, 34, 35, 36, 37, 41, 45]
rules = ["mutation"]
reason = "static mutants: the zod schemas are built once at module load, before stryker's per-test instrumentation activates, so no test is recorded as covering them. Applied by hand (an empty role literal, an empty metadata union, an empty content-type enum), each fails the parseTranscript accept/reject cases in transcript.test.ts — the suite kills them, the runner just cannot attribute it. parseTranscript's own lines are not exempt"

[[typescript.exempt]]
path = "parse-json-object.ts"
lines = [7]
rules = ["mutation"]
reason = "equivalent mutant: emptying the catch arm makes the function fall out of the try and return undefined, which is what the arm returns. JSON.parse has no non-throwing form, so the arm cannot be written to differ"

[[typescript.exempt]]
path = "telelux-message.ts"
lines = [13, 16, 17, 18, 19, 20, 21, 22, 25, 319]
rules = ["mutation"]
reason = "static mutants: the document icon, the reactive property table, the styles sheet, and the customElements.define call all run once at module load, before stryker's per-test instrumentation activates. Applied by hand, emptying the property table fails 're-renders when the message changes', flipping attribute to true fails 'ignores message and index attributes', emptying the theme entry or flipping reflect to false fails 'reflects the theme property to the attribute the stylesheet selects on', flipping state to false or emptying a state entry fails 'ignores attributes named after its internal state', emptying the icon fails the metadata popover test, and emptying the tag name throws at import so the whole file fails; emptying the stylesheet is invisible to jsdom and fails the role-colour assertions in tests/integration/message-block.test.ts"

[[typescript.exempt]]
path = "telelux-transcript.ts"
lines = [34]
rules = ["mutation"]
reason = "static mutant: the styles sheet is read once when Lit registers the class at module load, before stryker's per-test instrumentation activates, and jsdom applies no layout to observe it. Emptying it unpins the Previous / Next controls, which fails 'keeps the Previous and Next controls on screen while scrolling' in tests/integration/transcript-header.test.ts"

[[typescript.exempt]]
path = "telelux-metadata.ts"
lines = [10, 11, 12, 15, 72]
rules = ["mutation"]
reason = "static mutants: the reactive property table, the styles sheet, and the customElements.define call run once at module load, before stryker's per-test instrumentation activates. Applied by hand, emptying the property table fails 're-renders when the metadata changes', flipping attribute to true fails 'ignores a metadata attribute', emptying the theme entry or flipping reflect to false fails 'reflects the theme property to its attribute', and emptying the tag name throws at import. The stylesheet is layout only"

[[typescript.exempt]]
path = "target-block.ts"
lines = [8]
rules = ["mutation"]
reason = "equivalent mutant: indexing the extents with an undefined current yields undefined, which is what the guarded arm returns, so dropping the guard changes nothing. The guard exists for the type checker"

[[typescript.exempt]]
path = "current-block.ts"
lines = [7]
rules = ["mutation"]
reason = "equivalent mutant: forcing the undefined branch off indexes the extents with undefined, which also yields undefined, so the tracked block is skipped either way"

[[typescript.exempt]]
path = "strip-scroll.ts"
lines = [2, 5]
rules = ["mutation"]
reason = "equivalent mutants: at equality the chip already touches the edge, so the < to <= change returns start, which equals scroll, and the > to >= change returns start + size - viewport, which also equals scroll"

[[typescript.exempt]]
path = "telelux-minimap.ts"
lines = [128]
rules = ["mutation"]
reason = "equivalent mutant: forcing the undefined branch off indexes the chips with undefined, which also yields undefined, so the strip is left alone either way"

[[typescript.exempt]]
path = "telelux-minimap.ts"
lines = [8, 9, 10, 11, 12, 15, 182]
rules = ["mutation"]
reason = "static mutants: the reactive property table, the styles sheet, and the customElements.define call run once at module load, before stryker's per-test instrumentation activates. Applied by hand, emptying the table fails five tests including 'follows the current property'; emptying the messages, current, or active entry, flipping attribute to true, or flipping state to false fails 'ignores messages and current attributes'; emptying the theme entry or flipping reflect to false fails 'reflects the theme property to its attribute'; emptying the tag name throws at import. Emptying the stylesheet is invisible to jsdom and fails 'fills each chip with its role colour' in tests/integration/minimap.test.ts"
