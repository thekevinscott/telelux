name: Build Check

# PR-time build verification via piot's reusable build workflow — the
# heavier companion to check.yml. Runs the same plan + per-target build
# matrix as release.yml (every target in putitoutthere.toml), then stops
# before publish: no id-token, no registry auth, contents: read only.
# Catches build/staging breakage on the PR instead of during a Release
# run on main. Pinned to @v0 to match release.yml / check.yml.

on:
  pull_request:
    # Mirrors the putitoutthere.toml globs: each published package's
    # subtree minus what never ships (fragments, attestation receipts,
    # the gate config), plus the config, LICENSE, and this workflow. The
    # exclusions must stay a subset of what the globs carve out, or a
    # merge releases what this never built.
    paths:
      - 'packages/python/telelux/**'
      - '!packages/python/telelux/changelog.d/**'
      - '!packages/python/telelux/migrations.d/**'
      - '!packages/python/telelux/e2e-attestations/**'
      - '!packages/python/telelux/testing-conventions.toml'
      - 'packages/node/telelux-element/**'
      - '!packages/node/telelux-element/changelog.d/**'
      - '!packages/node/telelux-element/migrations.d/**'
      - '!packages/node/telelux-element/e2e-attestations/**'
      - '!packages/node/telelux-element/testing-conventions.toml'
      - 'putitoutthere.toml'
      - 'LICENSE'
      - '.github/workflows/build-check.yml'

permissions:
  contents: read

jobs:
  build-check:
    uses: thekevinscott/putitoutthere/.github/workflows/build.yml@v0
