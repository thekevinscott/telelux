name: Python

on:
  pull_request:
    paths:
      - 'packages/python/telelux/**'
      - '.github/workflows/python.yml'

permissions:
  contents: read

jobs:
  test:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v3
      - run: just test_unit
        working-directory: packages/python/telelux

  test-integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v3
      - run: just test_integration
        working-directory: packages/python/telelux

  build:
    name: Build wheel + smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          # hatch-vcs derives the version from the tag; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install uv
      - name: Build wheel
        run: uv build
        working-directory: packages/python/telelux
      - name: Install wheel + smoke (import)
        run: |
          python -m venv .venv
          .venv/bin/pip install packages/python/telelux/dist/*.whl
          .venv/bin/python -c "import telelux; print(telelux.__version__)"
