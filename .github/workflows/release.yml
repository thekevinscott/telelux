name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Preflight gate for first-publish prerequisites. Fails fast with an
  # actionable error before the reusable workflow runs, so a misconfigured
  # release does not produce confusing 404s deep in the publish step.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Repo visibility check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          if [ "$private" = "true" ]; then
            echo "::error::Repository is private. Trusted Publishing on PyPI requires a public repository so the provider can inspect the workflow file at the configured ref. Make the repo public (Settings -> General -> Danger Zone -> Change visibility) before releasing, or remove this preflight step if you have an alternative publish path."
            exit 1
          fi
          echo "Repo is public; OK to proceed."

  release:
    needs: preflight
    uses: thekevinscott/putitoutthere/.github/workflows/release.yml@v0
    permissions:
      contents: write
      id-token: write

  # PyPI upload runs in the caller's workflow context. Required because
  # PyPI Trusted Publishers can't validate OIDC tokens minted from a
  # cross-repo reusable workflow (pypi/warehouse#11096). The `if:` gate
  # skips this job when no PyPI upload was handed off; `!cancelled()` lets
  # the upload proceed even if the release job failed on something else.
  pypi-publish:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.pypi_pending == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-sdist'
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-wheel-*'
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Cuts the git tag for what the job above just uploaded. The release job
  # deliberately does not tag a PyPI package: a tag records what shipped,
  # and until the upload lands, nothing has.
  pypi-tag:
    needs: pypi-publish
    uses: thekevinscott/putitoutthere/.github/workflows/pypi-tag.yml@v0
    permissions:
      contents: write
