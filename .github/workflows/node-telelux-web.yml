name: node/telelux-web

# Fragments and the README feed no job here. Attestation receipts stay in
# scope: the conventions job's e2e-verify gate walks them.
on:
  pull_request:
    paths:
      - 'packages/node/telelux-web/**'
      - '!packages/node/telelux-web/changelog.d/**'
      - '!packages/node/telelux-web/migrations.d/**'
      - '!packages/node/telelux-web/README.md'
      - '.github/workflows/node-telelux-web.yml'

permissions:
  contents: read

jobs:
  conventions:
    name: node/telelux-web
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      source: packages/node/telelux-web/src
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}

  lint:
    name: 'node/telelux-web: lint'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node/telelux-web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run lint

  typecheck:
    name: 'node/telelux-web: typecheck'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node/telelux-web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck

  test-unit:
    name: 'node/telelux-web: unit'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node/telelux-web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run test_unit

  test-integration:
    name: 'node/telelux-web: integration'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node/telelux-web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm run test_integration

  build:
    name: 'node/telelux-web: build'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node/telelux-web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
