name: python/telelux

# Fragments and the README feed no job here. Attestation receipts stay in
# scope: the conventions job's e2e-verify gate walks them. The wheel ships
# telelux-web's viewer.html, so the viewer's sources feed the lane too.
on:
  pull_request:
    paths:
      - 'packages/python/telelux/**'
      - '!packages/python/telelux/changelog.d/**'
      - '!packages/python/telelux/migrations.d/**'
      - '!packages/python/telelux/README.md'
      - '.github/workflows/python-telelux.yml'
      - 'fixtures/**'
      - 'packages/node/telelux-web/**'
      - '!packages/node/telelux-web/changelog.d/**'
      - '!packages/node/telelux-web/migrations.d/**'
      - '!packages/node/telelux-web/README.md'
      - 'packages/node/telelux-element/src/**'
      - 'packages/node/telelux-element/package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  conventions:
    name: python/telelux
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["python"]'
      source: packages/python/telelux
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}

  test:
    name: 'python/telelux: unit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v3
      - run: just test_unit
        working-directory: packages/python/telelux

  test-integration:
    name: 'python/telelux: integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v3
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter telelux-web build
      - run: uv run playwright install --with-deps chromium
        working-directory: packages/python/telelux
      - run: just test_integration
        working-directory: packages/python/telelux

  build:
    name: 'python/telelux: build wheel + smoke'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          # hatch-vcs derives the version from the tag; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter telelux-web build
      - run: pip install uv
      - name: Build wheel
        run: uv build
        working-directory: packages/python/telelux
      - name: Install wheel + smoke (import)
        run: |
          python -m venv .venv
          .venv/bin/pip install packages/python/telelux/dist/*.whl
          .venv/bin/python -c "import telelux; print(telelux.__version__)"
      - name: Read the packaged viewer from the installed wheel
        run: .venv/bin/python -c "from telelux.read_viewer_html import read_viewer_html; read_viewer_html()"
