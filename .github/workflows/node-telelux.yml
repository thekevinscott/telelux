name: node/telelux

on:
  pull_request:
    paths:
      - 'packages/node/telelux/**'
      - '!packages/node/telelux/changelog.d/**'
      - '!packages/node/telelux/migrations.d/**'
      - '!packages/node/telelux/README.md'
      - '.github/workflows/node-telelux.yml'

permissions:
  contents: read

jobs:
  lint:
    name: 'node/telelux: lint'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node/telelux
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run lint

  typecheck:
    name: 'node/telelux: typecheck'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node/telelux
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck

  test-unit:
    name: 'node/telelux: unit'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node/telelux
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run test_unit

  build:
    name: 'node/telelux: build'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node/telelux
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build

  conventions:
    name: node/telelux
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      source: packages/node/telelux/src
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
