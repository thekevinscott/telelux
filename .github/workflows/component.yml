name: Component

# Fragments and the README feed no job here. Attestation receipts stay in
# scope: the conventions job's e2e-verify gate walks them.
on:
  pull_request:
    paths:
      - 'packages/node/telelux-element/**'
      - '!packages/node/telelux-element/changelog.d/**'
      - '!packages/node/telelux-element/migrations.d/**'
      - '!packages/node/telelux-element/README.md'
      - '.github/workflows/component.yml'

permissions:
  contents: read

jobs:
  conventions:
    name: TypeScript (component)
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      source: packages/node/telelux-element/src
      base: ${{ github.event.pull_request.base.sha || 'origin/main' }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node/telelux-element
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node/telelux-element
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck

  test-unit:
    name: Unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node/telelux-element
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run test_unit

  test-integration:
    name: Integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node/telelux-element
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build_demo
      - run: pnpm run test_integration

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node/telelux-element
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
