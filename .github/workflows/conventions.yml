name: Testing Conventions

# Enforce the testing-conventions standard on this repo's packages. Calls the
# upstream reusable workflow, which installs the published `testing-conventions`
# binary and runs each rule as its own job, failing the build on any violation.
#   https://github.com/thekevinscott/testing-conventions
#
# No `gates:` input, deliberately: an empty `gates` runs every applicable rule.
# Relax a rule with a `reason`-carrying exemption in the package's
# testing-conventions.toml, which is scoped and hard-errors once it goes stale.
# A `gates:` allowlist silently drops whole rules and never complains.
#
# Pinned to the upstream rolling `v0` tag (same convention as check.yml's
# putitoutthere pin): v0 tracks the latest backwards-compatible release of the
# reusable workflow.
#
# Per-language `path` because this is a monorepo: Python sources live under
# packages/python, TypeScript under packages/frontend/src. The reusable workflow
# scans a single root, so it is called once per language.

on:
  pull_request:
    paths:
      - 'packages/**'
      - '.github/workflows/conventions.yml'

permissions:
  contents: read

jobs:
  python:
    name: Python
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["python"]'
      source: packages/python

  typescript:
    name: TypeScript
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      source: packages/frontend/src

  typescript-component:
    name: TypeScript (component)
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      source: packages/component/src
