name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/node/telelux-element/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'netlify.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'packages/node/telelux-element/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'netlify.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 'docs: build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter telelux-element build
      - run: pnpm --filter docs build
