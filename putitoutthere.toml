# putitoutthere config — two published packages: the Python SDK on PyPI and
# the web component on npm. The workspace under packages/node/telelux-web is internal
# tooling (the viewer's frontend source and build) and is never published.

[putitoutthere]
version = 1

[[package]]
name = "telelux-pypi"
kind = "pypi"
pypi = "telelux"
path = "packages/python/telelux"
build = "hatch"
# Keep bookkeeping paths out of release cascades. The root pattern covers
# package files, while the subtree pattern excludes fragment and attestation
# directories. A leading `!` is not a substitute: minimatch makes it match
# everything outside the subtree, so it would cascade LICENSE on every commit.
globs = [
  "packages/python/telelux/!(testing-conventions.toml)",
  "packages/python/telelux/!(changelog.d|migrations.d|e2e-attestations)/**",
  "LICENSE",
]

[[package]]
name = "telelux-element-npm"
kind = "npm"
npm = "telelux-element"
path = "packages/node/telelux-element"
tag_format = "telelux-element-v{version}"
# Keep bookkeeping paths out of release cascades. The root pattern covers
# package files, while the subtree pattern excludes fragment and attestation
# directories. A leading `!` is not a substitute: minimatch makes it match
# everything outside the subtree, so it would cascade LICENSE on every commit.
globs = [
  "packages/node/telelux-element/!(testing-conventions.toml)",
  "packages/node/telelux-element/!(changelog.d|migrations.d|e2e-attestations)/**",
  "packages/node/telelux-element/pnpm-lock.yaml",
  "LICENSE",
]
