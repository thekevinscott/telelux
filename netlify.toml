[build]
  base = "."
  command = "pnpm --filter telelux-element build && pnpm --filter docs build"
  publish = "docs/.vitepress/dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- docs packages/node/telelux-element pnpm-workspace.yaml pnpm-lock.yaml netlify.toml .github/workflows/docs.yml"

[build.environment]
  NODE_VERSION = "24"
